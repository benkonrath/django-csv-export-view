name: Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade 'tox>=4.0'
      - name: Run pre-commit linting
        run: tox -e pre-commit

  test_python_36:
    runs-on: ubuntu-20.04
    name: Python 3.6
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.6
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-py
      - name: Run tests
        run: tox --py 36

  test_python_37:
    runs-on: ubuntu-22.04
    name: Python 3.7
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.7
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-py
      - name: Run tests
        run: tox --py 37

  test_python_38:
    runs-on: ubuntu-22.04
    name: Python 3.8
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.8
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-py
      - name: Run tests
        run: tox --py 38

  test_python_39:
    runs-on: ubuntu-22.04
    name: Python 3.9
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-py
      - name: Run tests
        run: tox --py 39

  test_python_310:
    runs-on: ubuntu-22.04
    name: Python 3.10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-py
      - name: Run tests
        run: tox --py 310

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
          - 'pypy3.9'
          - 'pypy3.10'
    name: Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade 'tox>=4.0'
      - name: Run tests
        run: tox run -f py$(echo ${{ matrix.python-version }} | sed "s/^py//" | tr -d .)
